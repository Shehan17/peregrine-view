name: Feature idea
description: Suggest something new for PeregrineView.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PeregrineView is a fast viewer, so editing, animation, scripts, tabs, multiple windows, a settings window and a GPU renderer are out of scope. See [CONTRIBUTING.md](https://github.com/Shehan17/peregrine-view/blob/main/CONTRIBUTING.md) for the reasons.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for how it could look or behave, such as a key, a button or a menu.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to build this myself.
