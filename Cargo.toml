[package]
name = "peregrineview"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight SVG viewer"
license = "MIT OR Apache-2.0"

[dependencies]
resvg = "0.49"
winit = "0.30.13"
softbuffer = "0.4.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
