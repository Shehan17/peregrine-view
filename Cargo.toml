[package]
name = "peregrineview"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight SVG viewer"
license = "MIT OR Apache-2.0"

[dependencies]
# svgz is off: the loader unzips itself so it can detect the text encoding after.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
winit = "0.30.13"
softbuffer = "0.4.8"
flate2 = "1.1"
rfd = "0.17"
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
# For clipboard paste. Not in the spec's crate list; there is no std way to read the clipboard.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
notify = "8.2"

# Receives files opened from Finder. These are the versions rfd, arboard and
# softbuffer already use, so they add no new code to build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# File associations, used by cargo-packager when packaging: the Windows
# installer registers the extensions, the macOS Info.plist declares them as
# document types, and the Linux .desktop file lists the MIME types.
[package.metadata.packager]
product-name = "PeregrineView"
identifier = "com.peregrineview.viewer"

[[package.metadata.packager.file-associations]]
extensions = ["svg"]
mime-type = "image/svg+xml"
name = "SVG image"
description = "SVG image"
role = "Viewer"

[[package.metadata.packager.file-associations]]
extensions = ["svgz"]
mime-type = "image/svg+xml-compressed"
name = "Compressed SVG image"
description = "Compressed SVG image"
role = "Viewer"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
