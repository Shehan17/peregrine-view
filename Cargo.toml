[package]
name = "peregrineview"
version = "0.1.0"
edition = "2024"
description = "A fast, lightweight SVG viewer"
license = "MIT OR Apache-2.0"

[dependencies]
# svgz is off: the loader unzips itself so it can detect the text encoding after.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
winit = "0.30.13"
softbuffer = "0.4.8"
flate2 = "1.1"
rfd = "0.17"
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
# For clipboard paste. Not in the spec's crate list; there is no std way to read the clipboard.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
notify = "8.2"

# Receives files opened from Finder. These are the versions rfd, arboard and
# softbuffer already use, so they add no new code to build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# Puts the app icon and version info into the Windows exe (see build.rs).
# Build-time only: it adds nothing to the app itself.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

# Packaging with cargo-packager: `cargo packager --release` makes the Windows
# installer in dist/. Only Windows is packaged for now; macOS and Linux come
# later. The file associations make the Windows installer register the
# extensions, the macOS Info.plist declare them as document types, and the
# Linux .desktop file list the MIME types.
[package.metadata.packager]
product-name = "PeregrineView"
# A placeholder. It must be final before the first macOS release, because
# macOS treats an app with a changed identifier as a different app.
identifier = "com.peregrineview.viewer"
before-packaging-command = "cargo build --release --locked"
out-dir = "dist"
formats = ["nsis"]
icons = ["assets/icons/icon.ico", "assets/App_Icon.png"]

[package.metadata.packager.nsis]
# The default template with a fixed uninstaller; see the top of the file.
template = "assets/installer.nsi"
installer-icon = "assets/icons/icon.ico"

# `name` is the Windows file type id (ProgID) in the registry; `description`
# is what Explorer shows as the file's type.
[[package.metadata.packager.file-associations]]
extensions = ["svg"]
mime-type = "image/svg+xml"
name = "PeregrineView.svg"
description = "SVG image"
role = "viewer"

[[package.metadata.packager.file-associations]]
extensions = ["svgz"]
mime-type = "image/svg+xml-compressed"
name = "PeregrineView.svgz"
description = "Compressed SVG image"
role = "viewer"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
